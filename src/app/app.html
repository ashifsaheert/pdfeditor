<main class="app-root-container">
  <!-- Landing Page: Shown when no document is active -->
  <app-landing-page
    *ngIf="!activePdfDoc()"
    (documentLoaded)="onDocumentLoaded($event)"
  ></app-landing-page>

  <!-- Editor Workspace: Active editing view -->
  <app-editor-workspace
    *ngIf="activePdfDoc()"
    [pdfDoc]="activePdfDoc()"
    (resetDocument)="onResetDocument()"
  ></app-editor-workspace>

  <!-- Global Loading Overlay -->
  <div *ngIf="state.isLoading()" class="global-loading-overlay">
    <div class="global-spinner"></div>
    <span class="loading-msg">{{ state.loadingMessage() || 'Processing...' }}</span>
  </div>
</main>
